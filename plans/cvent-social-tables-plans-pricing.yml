api_access:
  plan_required: unknown
  note: >-
    No tier on the pricing page mentions API access, and the developer portal
    (https://developer.socialtables.com) offers app registration without naming a plan. Whether
    the 4.0 API is reachable from a Free or Standard account is not stated anywhere public.
