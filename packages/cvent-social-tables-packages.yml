description: >-
  Client-library survey for the Social Tables (Cvent) API. Registries searched unauthenticated:
  npm, PyPI, RubyGems, Packagist, crates.io, NuGet, Maven Central, pkg.go.dev. FINDING: Social
  Tables publishes NO first-party API client SDK in any language. The @socialtables npm scope
  and the socialtables GitHub org are real and first-party, but everything in them is internal
  engineering tooling and general-purpose React/Node open source (session middleware, a SAML
  protocol implementation, a 2D CAD component, validation helpers) — none of it wraps the
  api.socialtables.com REST surface. The only first-party integration artifact aimed at API
  consumers is the reference Express application the developer tutorial links to. Because no
  official SDK exists, this record deliberately emits NO `SDKs` pointer in apis.yml.
