source: https://www.socialtables.com/pricing/
description: >-
  Published plans for Social Tables / Cvent Event Diagramming, read from the provider's own
  pricing page on 2026-09-07. This replaces a 2026-05-04 bulk-sweep scaffold whose tier names,
  prices and quotas were placeholder defaults, not provider-published values. IMPORTANT: these
  are PRODUCT plans. Social Tables publishes no API-specific plan, no API pricing, and no
  quota expressed in API calls — API access is obtained by registering an OAuth app on the
  developer portal, and the developer portal states no plan requirement or price.
tags:
  - Diagramming
  - Event Design
  - Event Management
  - Hospitality
  - Seating Charts
currency: USD
billing_note: >-
  Prices below are the monthly figures shown on the pricing page. The page also offers annual
  billing with a stated saving of 18% (Standard), 17% (Pro) and 9% (Premium); the annual
  totals are rendered client-side and are not recorded here rather than being estimated.
  The page states "All paid plans have a 12-month commitment."
plan_count: 5
